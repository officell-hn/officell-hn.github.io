<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Pedido — OFFICELL</title>
<meta name="description" content="Consulta el estado de tu pedido o reparación en OFFICELL Servicio Técnico, Danlí. Ingresa tu código de seguimiento y revisa el avance en tiempo real.">
<link rel="canonical" href="https://officell-hn.github.io/seguimiento.html" />
<style>
:root {
  --bg:#0a0a0f; --surface:#12121a; --card:#1a1a26; --border:#2a2a3a;
  --text:#e8e8f0; --muted:#8888a0; --accent:#00d4ff;
  --green:#00e88f; --gradient:linear-gradient(135deg,#00d4ff,#0066ff);
  --purple:#a855f7; --purple2:#6d28d9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; height: 60px; display: flex; align-items: center; justify-content: space-between; }
.brand { font-weight: 900; font-size: 1.2rem; letter-spacing: 0.04em; text-decoration: none; color: var(--text); }
.brand span { color: var(--accent); }
.brand-sub { font-size: 0.75rem; color: var(--muted); font-weight: 400; }

main { max-width: 600px; margin: 0 auto; padding: 2rem 1rem; }

.search-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; }
.search-box h2 { font-size: 1.1rem; margin-bottom: 1rem; }
.input-row { display: flex; gap: 0.75rem; }
.input-row input { flex: 1; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 1rem; outline: none; font-family: 'Courier New', monospace; text-transform: uppercase; }
.input-row input:focus { border-color: var(--accent); }
.input-row button { padding: 0.75rem 1.25rem; background: var(--gradient); color: #000; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; }

#resultado { display: none; }

.estado-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; }
.estado-badge { display: inline-block; padding: 0.5rem 1.2rem; border-radius: 20px; font-weight: 700; font-size: 1rem; margin-bottom: 1rem; }
.badge-proceso  { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid #ffaa00; }
.badge-completado { background: rgba(0,232,143,0.15); color: var(--green); border: 1px solid var(--green); }
.badge-cancelado { background: rgba(255,68,68,0.15); color: #ff4444; border: 1px solid #ff4444; }

.codigo-disp { font-family: 'Courier New', monospace; font-size: 1.6rem; font-weight: 900; color: var(--accent); letter-spacing: 3px; margin-bottom: 0.25rem; }
.fecha-disp { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.5rem; }

.seccion-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 0.5rem; }
.item-lista { background: var(--surface); border-radius: 8px; padding: 0.6rem 0.9rem; margin-bottom: 0.4rem; display: flex; justify-content: space-between; font-size: 0.9rem; }
.total-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.05rem; color: var(--accent); padding-top: 0.75rem; border-top: 1px solid var(--border); margin-top: 0.5rem; }

.game-id-badge { background: rgba(168,85,247,0.12); border: 1px solid var(--purple); border-radius: 8px; padding: 0.5rem 0.9rem; font-size: 0.9rem; margin-top: 0.75rem; }
.game-id-badge span { color: var(--purple); font-weight: 700; }

.qr-section { text-align: center; margin-top: 1.5rem; }
.qr-section img { width: 150px; height: 150px; border-radius: 10px; background: #fff; padding: 4px; }
.qr-section p { font-size: 0.78rem; color: var(--muted); margin-top: 0.5rem; }

.error-box { background: rgba(255,68,68,0.08); border: 1px solid #ff4444; border-radius: 12px; padding: 1.2rem 1.5rem; color: #ff8888; text-align: center; }
.loading-box { text-align: center; padding: 2rem; color: var(--muted); }
.spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }

.btn-wa { display: block; margin: 1.5rem auto 0; padding: 0.8rem 1.5rem; background: #25d366; color: #000; border: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; text-decoration: none; text-align: center; max-width: 280px; }
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Seguimiento de Pedido",
  "url": "https://officell-hn.github.io/seguimiento.html",
  "description": "Consulta el estado de tu pedido o reparación en OFFICELL Servicio Técnico, Danlí.",
  "publisher": {
    "@type": "Organization",
    "name": "OFFICELL Servicio Técnico",
    "logo": { "@type": "ImageObject", "url": "https://officell-hn.github.io/LOGO_OFFICELL.png" }
  }
}
</script>
</head>
<body>

<header>
  <a href="https://officell-hn.github.io/tienda.html" class="brand">OFFICE<span>LL</span>
    <div class="brand-sub">Seguimiento de Pedido</div>
  </a>
  <a href="https://officell-hn.github.io/tienda.html" style="font-size:0.85rem;color:var(--muted);text-decoration:none">← Tienda</a>
</header>

<main>
  <h1 style="font-size:1.5rem;text-align:center;margin-bottom:1.25rem;font-weight:700">Seguimiento de Pedido — OFFICELL</h1>
  <div class="search-box">
    <h2>🔍 Consulta tu pedido</h2>
    <div class="input-row">
      <input type="text" id="inputCodigo" placeholder="PED-0505-1234" maxlength="20">
      <button onclick="buscar()">Buscar</button>
    </div>
  </div>

  <div id="resultado"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const API = (typeof OFFICELL_CONFIG !== 'undefined') ? OFFICELL_CONFIG.API : 'https://officell-ia-production.up.railway.app/api/tienda';

// esc() — definida en config.js (función canónica compartida)

// Autocargar si viene código en la URL
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get('codigo') || params.get('code') || '';
  if (codigo) {
    document.getElementById('inputCodigo').value = codigo.toUpperCase();
    buscar();
  }
});

async function buscar() {
  const codigo = document.getElementById('inputCodigo').value.trim().toUpperCase();
  if (!codigo) return;

  const el = document.getElementById('resultado');
  el.style.display = 'block';
  el.innerHTML = `<div class="loading-box"><div class="spinner"></div>Buscando pedido...</div>`;

  try {
    const r = await fetch(`${API}/pedido/${encodeURIComponent(codigo)}`);
    const data = await r.json();

    if (!data.ok) {
      el.innerHTML = `<div class="error-box">❌ ${esc(data.error) || 'Código no encontrado.'}<br><br><small>Verifica el código en tu comprobante de WhatsApp.</small><br><br><small>¿Tu código es de una <b>reparación</b> del taller? Búscalo aquí: <a href="taller.html?codigo=${encodeURIComponent(codigo)}" style="color:var(--accent);font-weight:700">seguimiento del taller →</a></small></div>`;
      return;
    }

    const p = data.pedido;
    const badgeClass = p.estado === 'completado' ? 'badge-completado' : p.estado === 'cancelado' ? 'badge-cancelado' : 'badge-proceso';
    const fecha = p.fecha ? new Date(p.fecha).toLocaleString('es-HN', { timeZone: 'America/Tegucigalpa', dateStyle: 'long', timeStyle: 'short' }) : '—';
    const items = Array.isArray(p.productos) ? p.productos : [];
    const trackUrl = window.location.href.split('?')[0] + '?codigo=' + encodeURIComponent(p.codigo);

    el.innerHTML = `
      <div class="estado-card">
        <div class="seccion-label">Código de pedido</div>
        <div class="codigo-disp">${esc(p.codigo)}</div>
        <div class="fecha-disp">📅 Pedido realizado: ${esc(fecha)}</div>

        <div class="seccion-label" style="margin-bottom:0.5rem">Estado actual</div>
        <div class="estado-badge ${badgeClass}">${esc(p.estado_desc)}</div>

        ${p.game_id ? `
        <div class="game-id-badge">🎮 ID de jugador: <span>${esc(p.game_id)}</span></div>` : ''}
      </div>

      <div class="estado-card">
        <div class="seccion-label">Resumen del pedido</div>
        ${items.map(i => `
          <div class="item-lista">
            <span>${esc(i.nombre)} x${esc(i.cantidad)}</span>
            <span>L.${(parseFloat(i.precio||0)*parseInt(i.cantidad||1)).toLocaleString('es-HN')}</span>
          </div>`).join('')}
        <div class="total-row">
          <span>TOTAL</span>
          <span>L.${parseFloat(p.total||0).toLocaleString('es-HN')}</span>
        </div>
      </div>

      <div class="qr-section">
        <div class="seccion-label" style="text-align:center;margin-bottom:0.75rem">QR de seguimiento</div>
        <canvas id="qr-canvas" style="border-radius:8px;background:#fff;padding:4px;width:150px;height:150px"></canvas>
        <p>Guarda este QR para consultar tu pedido en cualquier momento</p>
      </div>

      <a class="btn-wa" href="https://wa.me/50493323393?text=${encodeURIComponent('Hola, consulto por mi pedido *' + p.codigo + '*')}" target="_blank" rel="noopener">
        💬 Consultar por WhatsApp
      </a>
    `;
    // Generar QR localmente (sin dependencia externa)
    QRCode.toCanvas(document.getElementById('qr-canvas'), trackUrl, { width: 150, margin: 1, errorCorrectionLevel: 'M' })
      .catch(() => {});

  } catch(e) {
    el.innerHTML = `<div class="error-box">⚠️ Error de conexión. Intenta de nuevo.</div>`;
  }
}

document.getElementById('inputCodigo').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscar();
});
</script>
</body>
</html>
