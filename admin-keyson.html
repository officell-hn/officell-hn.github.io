<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Keyson WhatsApp — OFFICELL</title>
<style>
:root{
  --bg:#0a0a0f;--surface:#12121a;--card:#1a1a26;--border:#2a2a3a;
  --text:#e8e8f0;--muted:#8888a0;--accent:#00d4ff;--accent2:#ff6b35;
  --green:#00e88f;--gradient:linear-gradient(135deg,#00d4ff,#0066ff);
  --danger:#ff4444;--warning:#ffaa00;
  --wa-out:#005c4b;--wa-in:#1f2c33;--wa-sys:#0a3428;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:380px;text-align:center}
.login-logo{font-size:2.5rem;font-weight:900;letter-spacing:0.05em;margin-bottom:0.25rem}
.login-logo span{color:var(--accent)}
.login-sub{color:var(--muted);font-size:0.9rem;margin-bottom:2rem}
.login-card input{width:100%;padding:0.9rem 1.2rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;margin-bottom:1rem;outline:none}
.login-card input:focus{border-color:var(--accent)}
.btn-login{width:100%;padding:0.9rem;background:var(--gradient);color:#000;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity 0.2s}
.btn-login:hover{opacity:0.85}
.login-error{color:var(--danger);font-size:0.85rem;margin-top:0.75rem;display:none}

/* APP */
#app{display:none;height:100vh;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header-brand{font-weight:800;font-size:1.1rem;letter-spacing:0.04em}
.header-brand span{color:var(--accent)}
.header-sub{font-size:0.8rem;color:var(--muted);margin-left:0.75rem}
.header-left{display:flex;align-items:baseline;gap:0}
.header-actions{display:flex;gap:0.75rem;align-items:center}
.btn-sm{padding:0.45rem 1rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:0.85rem;transition:all 0.2s}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.danger:hover{border-color:var(--danger);color:var(--danger)}

/* STATS */
.stats-bar{display:flex;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.stat-pill{background:var(--card);border:1px solid var(--border);border-radius:50px;padding:0.45rem 1.1rem;display:flex;align-items:center;gap:0.5rem;font-size:0.85rem}
.stat-pill .num{font-weight:800;color:var(--accent)}
.stat-pill .lbl{color:var(--muted)}

/* LAYOUT */
.chat-layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 60px - 58px)}

/* SIDEBAR */
.sidebar{width:340px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
.sidebar-header{padding:1rem;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:0.75rem}
.sidebar-title{font-weight:700;font-size:1rem}
.search-input{width:100%;padding:0.65rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:50px;color:var(--text);font-size:0.88rem;outline:none;transition:border-color 0.2s}
.search-input:focus{border-color:var(--accent)}
.filtro-dias{display:flex;gap:0.4rem;flex-wrap:wrap}
.fdias-btn{padding:0.3rem 0.75rem;border-radius:50px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:0.78rem;transition:all 0.2s}
.fdias-btn.active,.fdias-btn:hover{background:var(--gradient);border-color:transparent;color:#000;font-weight:700}
.cliente-list{flex:1;overflow-y:auto}
.cliente-item{padding:0.9rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s;display:flex;gap:0.75rem;align-items:flex-start}
.cliente-item:hover{background:var(--card)}
.cliente-item.active{background:rgba(0,212,255,0.08);border-left:3px solid var(--accent)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:#000;flex-shrink:0}
.cliente-info{flex:1;min-width:0}
.cliente-nombre{font-weight:600;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cliente-preview{font-size:0.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:0.2rem}
.cliente-meta{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:0.3rem}
.cliente-fecha{font-size:0.72rem;color:var(--muted)}
.badge-count{background:var(--accent);color:#000;border-radius:50px;padding:0.15rem 0.5rem;font-size:0.7rem;font-weight:800}
.empty-list{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:0.88rem}

/* CHAT */
.chat-panel{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.chat-header{padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:1rem}
.chat-avatar{width:40px;height:40px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.95rem;color:#000}
.chat-info{flex:1}
.chat-nombre{font-weight:700;font-size:1rem}
.chat-phone{font-size:0.78rem;color:var(--muted)}
.chat-msgs{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:0.5rem}
.msg-wrapper{display:flex;flex-direction:column;max-width:75%}
.msg-wrapper.out{align-self:flex-end;align-items:flex-end}
.msg-wrapper.in{align-self:flex-start;align-items:flex-start}
.msg-wrapper.sys{align-self:center;align-items:center;max-width:90%}
.bubble{padding:0.6rem 0.9rem;border-radius:12px;font-size:0.9rem;line-height:1.45;word-break:break-word;position:relative}
.bubble.out{background:var(--wa-out);border-bottom-right-radius:3px}
.bubble.in{background:var(--wa-in);border-bottom-left-radius:3px}
.bubble.sys{background:var(--wa-sys);border-radius:8px;font-size:0.78rem;color:#7ecdb5;text-align:center;padding:0.4rem 0.9rem}
.bubble.keyson{background:rgba(0,102,255,0.15);border:1px solid rgba(0,102,255,0.25);border-bottom-left-radius:3px}
.role-label{font-size:0.7rem;color:var(--muted);margin-bottom:0.2rem;padding:0 0.2rem}
.msg-time{font-size:0.68rem;color:rgba(255,255,255,0.35);margin-top:0.25rem;padding:0 0.2rem}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;color:var(--muted)}
.chat-empty .icon{font-size:4rem}
.chat-empty p{font-size:0.9rem}

/* LOADING */
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:2rem auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{width:100%;display:none}
  .sidebar.visible{display:flex}
  .chat-panel{display:none}
  .chat-panel.visible{display:flex}
  .stats-bar{padding:0.75rem 1rem}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">OFFICE<span>LL</span></div>
    <div class="login-sub">Keyson — Auditoría de Conversaciones</div>
    <input type="password" id="pwdInput" placeholder="Contraseña de administrador"
           onkeydown="if(event.key==='Enter')login()">
    <button class="btn-login" onclick="login()">Entrar</button>
    <div class="login-error" id="loginError">Contraseña incorrecta</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-left">
      <div class="header-brand">OFFICE<span>LL</span></div>
      <span class="header-sub">— Keyson WhatsApp</span>
    </div>
    <div class="header-actions">
      <button class="btn-sm" onclick="recargar()">🔄 Actualizar</button>
      <button class="btn-sm danger" onclick="logout()">Salir</button>
    </div>
  </header>

  <!-- STATS -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-pill"><span class="num" id="statClientes">—</span><span class="lbl">Clientes este mes</span></div>
    <div class="stat-pill"><span class="num" id="statHoy">—</span><span class="lbl">Mensajes hoy</span></div>
    <div class="stat-pill"><span class="num" id="statSemana">—</span><span class="lbl">Esta semana</span></div>
    <div class="stat-pill"><span class="num" id="statHandoffs">—</span><span class="lbl">Handoffs al dueño</span></div>
  </div>

  <!-- LAYOUT -->
  <div class="chat-layout">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">💬 Conversaciones</div>
        <input class="search-input" id="searchInput" type="text" placeholder="🔍 Buscar cliente o número..."
               oninput="buscarClientes(this.value)">
        <div class="filtro-dias">
          <button class="fdias-btn active" onclick="cambiarDias(7,this)">7 días</button>
          <button class="fdias-btn" onclick="cambiarDias(30,this)">30 días</button>
          <button class="fdias-btn" onclick="cambiarDias(90,this)">90 días</button>
          <button class="fdias-btn" onclick="cambiarDias(365,this)">Todo</button>
        </div>
      </div>
      <div class="cliente-list" id="clienteList">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- CHAT -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-empty" id="chatEmpty">
        <div class="icon">💬</div>
        <p>Selecciona un cliente para ver su conversación</p>
      </div>
      <div id="chatContenido" style="display:none;flex:1;flex-direction:column;overflow:hidden">
        <div class="chat-header" id="chatHeader"></div>
        <div class="chat-msgs" id="chatMsgs"></div>
      </div>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script>
const API = (typeof OFFICELL_CONFIG !== 'undefined') ? OFFICELL_CONFIG.API : 'https://officell-ia-production.up.railway.app/api/tienda';
let TOKEN = '';
let diasActual = 7;
let buscarTimeout = null;
let clienteActivo = null;

// ── AUTH ────────────────────────────────────────────────────
function authHeaders() {
  return TOKEN ? { 'Authorization': `Bearer ${TOKEN}` } : {};
}
function authHeadersPost() {
  return TOKEN ? { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` } : { 'Content-Type': 'application/json' };
}

async function login() {
  const pwd = document.getElementById('pwdInput').value;
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  try {
    const r = await fetch(`${API}/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: pwd })
    });
    const d = await r.json();
    if (!d.ok) { err.style.display = 'block'; return; }
    TOKEN = d.jwt;
    sessionStorage.setItem('oc_admin_jwt', TOKEN);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    cargarDatos();
  } catch(e) { err.textContent = 'Error de conexión'; err.style.display = 'block'; }
}

function logout() {
  TOKEN = ''; sessionStorage.removeItem('oc_admin_jwt');
  location.reload();
}

// ── INIT ─────────────────────────────────────────────────────
// Solo carga los datos del panel (no toca la UI de login/app)
async function cargarDatos() {
  await Promise.all([cargarStats(), cargarClientes()]);
}

// Restaura una sesión guardada al cargar la página (auto-login)
async function init() {
  const saved = sessionStorage.getItem('oc_admin_jwt');
  if (!saved) return;
  TOKEN = saved;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  await cargarDatos();
}

window.addEventListener('load', init);

async function recargar() {
  await Promise.all([cargarStats(), cargarClientes(document.getElementById('searchInput').value)]);
  if (clienteActivo) await abrirConversacion(clienteActivo.phone, clienteActivo.nombre);
}

// ── STATS ─────────────────────────────────────────────────────
async function cargarStats() {
  try {
    const r = await fetch(`${API}/admin/keyson/stats`, { headers: authHeaders() });
    if (r.status === 401) { logout(); return; }
    if (!r.ok) return;
    const d = await r.json();
    if (!d.ok) return;
    const s = d.stats;
    document.getElementById('statClientes').textContent = s.clientes_mes || 0;
    document.getElementById('statHoy').textContent = s.mensajes_hoy || 0;
    document.getElementById('statSemana').textContent = s.mensajes_semana || 0;
    document.getElementById('statHandoffs').textContent = s.handoffs_mes || 0;
  } catch(e) {}
}

// ── CLIENTES ──────────────────────────────────────────────────
async function cargarClientes(buscar = '') {
  const list = document.getElementById('clienteList');
  list.innerHTML = '<div class="spinner"></div>';
  try {
    const params = new URLSearchParams({ dias: diasActual, buscar });
    const r = await fetch(`${API}/admin/keyson/clientes?${params}`, { headers: authHeaders() });
    if (r.status === 401) { logout(); return; }
    const d = await r.json();
    if (!d.ok || !d.clientes.length) {
      list.innerHTML = '<div class="empty-list">Sin conversaciones en este período</div>';
      return;
    }
    list.innerHTML = d.clientes.map(c => `
      <div class="cliente-item" data-phone="${esc(c.client_phone)}" data-nombre="${esc(c.nombre||'')}" onclick="abrirConversacion(this.dataset.phone,this.dataset.nombre)">
        <div class="avatar">${iniciales(c.nombre || c.client_phone)}</div>
        <div class="cliente-info">
          <div class="cliente-nombre">${esc(c.nombre || formatPhone(c.client_phone))}</div>
          <div class="cliente-preview">${esc((c.ultimo_texto||'').slice(0,60))}</div>
        </div>
        <div class="cliente-meta">
          <div class="cliente-fecha">${fechaCorta(c.ultimo_mensaje)}</div>
          <div class="badge-count">${c.total_mensajes}</div>
        </div>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = '<div class="empty-list">Error cargando clientes</div>';
  }
}

function buscarClientes(val) {
  clearTimeout(buscarTimeout);
  buscarTimeout = setTimeout(() => cargarClientes(val), 350);
}

function cambiarDias(dias, btn) {
  diasActual = dias;
  document.querySelectorAll('.fdias-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  cargarClientes(document.getElementById('searchInput').value);
}

// ── CONVERSACIÓN ──────────────────────────────────────────────
async function abrirConversacion(phone, nombre) {
  clienteActivo = { phone, nombre };

  // Marcar activo en sidebar
  document.querySelectorAll('.cliente-item').forEach(el => {
    el.classList.toggle('active', el.dataset.phone === phone);
  });

  const empty = document.getElementById('chatEmpty');
  const contenido = document.getElementById('chatContenido');
  const header = document.getElementById('chatHeader');
  const msgs = document.getElementById('chatMsgs');

  empty.style.display = 'none';
  contenido.style.display = 'flex';
  msgs.innerHTML = '<div class="spinner"></div>';

  const nomMostrar = nombre || formatPhone(phone);
  header.innerHTML = `
    <div class="chat-avatar">${iniciales(nomMostrar)}</div>
    <div class="chat-info">
      <div class="chat-nombre">${esc(nomMostrar)}</div>
      <div class="chat-phone">${formatPhone(phone)}</div>
    </div>
  `;

  try {
    const r = await fetch(`${API}/admin/keyson/conversacion/${encodeURIComponent(phone)}`, { headers: authHeaders() });
    if (r.status === 401) { logout(); return; }
    const d = await r.json();
    if (!d.ok || !d.mensajes.length) {
      msgs.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)">Sin mensajes registrados</div>';
      return;
    }

    let fechaAnterior = '';
    msgs.innerHTML = d.mensajes.map(m => {
      const fecha = new Date(m.creado_en);
      const fechaDia = fecha.toLocaleDateString('es-HN', { weekday:'long', day:'numeric', month:'long' });
      let separador = '';
      if (fechaDia !== fechaAnterior) {
        separador = `<div style="text-align:center;margin:1rem 0">
          <span style="background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:0.3rem 1rem;font-size:0.75rem;color:var(--muted)">${fechaDia}</span>
        </div>`;
        fechaAnterior = fechaDia;
      }

      const tipo = rolTipo(m.role);
      const hora = fecha.toLocaleTimeString('es-HN', { hour:'2-digit', minute:'2-digit' });
      return `${separador}
        <div class="msg-wrapper ${tipo.wrapper}">
          <div class="role-label">${tipo.label}</div>
          <div class="bubble ${tipo.bubble}">${esc(m.mensaje)}</div>
          <div class="msg-time">${hora}</div>
        </div>`;
    }).join('');

    msgs.scrollTop = msgs.scrollHeight;
  } catch(e) {
    msgs.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--danger)">Error cargando mensajes</div>';
  }
}

// ── HELPERS ───────────────────────────────────────────────────
function rolTipo(role) {
  if (role === 'cliente') return { wrapper: 'in', bubble: 'in', label: '👤 Cliente' };
  if (role === 'keyson')  return { wrapper: 'out', bubble: 'keyson', label: '🤖 Keyson' };
  if (role === 'dueno')   return { wrapper: 'out', bubble: 'out', label: '👑 Adonias' };
  return { wrapper: 'sys', bubble: 'sys', label: '' };
}

function iniciales(str) {
  if (!str) return '?';
  const parts = str.trim().split(' ');
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  if (str.startsWith('504') || str.match(/^\d/)) return '📱';
  return str[0].toUpperCase();
}

function formatPhone(p) {
  if (!p) return '';
  const n = p.replace(/\D/g,'');
  if (n.startsWith('504') && n.length === 11) return `+504 ${n.slice(3,7)}-${n.slice(7)}`;
  return p;
}

function fechaCorta(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const hoy = new Date();
  const diff = (hoy - d) / 86400000;
  if (diff < 1) return d.toLocaleTimeString('es-HN', { hour:'2-digit', minute:'2-digit' });
  if (diff < 7) return d.toLocaleDateString('es-HN', { weekday:'short' });
  return d.toLocaleDateString('es-HN', { day:'numeric', month:'short' });
}

// esc() — definida en config.js (función canónica compartida, escapa también ')

// Sesión restaurada por window.addEventListener('load') arriba — no duplicar
</script>
</body>
</html>
