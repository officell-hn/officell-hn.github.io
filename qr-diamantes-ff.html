<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>QR Diamantes Free Fire — OFFICELL</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
  /* ── Pantalla ── */
  body {
    font-family: Arial, sans-serif;
    background: #1a0a2e;
    color: #fff;
    margin: 0;
    padding: 1.5rem;
    text-align: center;
  }
  h1 { font-size: 1.6rem; margin-bottom: 0.2rem; }
  .sub { color: #c084fc; margin-bottom: 1rem; font-size: 0.9rem; }
  #btn-imprimir {
    background: linear-gradient(135deg, #a855f7, #6d28d9);
    color: #fff; border: none; border-radius: 10px;
    padding: 0.75rem 2rem; font-size: 1rem; font-weight: 700;
    cursor: pointer; margin-bottom: 1.5rem;
  }
  #btn-imprimir:hover { opacity: 0.85; }

  /* ── Impresión ── */
  @media print {
    body { background: #fff !important; padding: 0; margin: 0; }
    #controles { display: none !important; }
    #hoja { box-shadow: none !important; margin: 0 !important; }
  }

  /* ── Hoja ── */
  #hoja {
    background: #fff;
    color: #000;
    width: 216mm;
    height: 279mm;
    margin: 0 auto;
    padding: 4mm 5mm;
    box-sizing: border-box;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Cabecera compacta */
  .hoja-cabecera {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #6d28d9;
    padding-bottom: 2mm;
    margin-bottom: 2mm;
    flex-shrink: 0;
  }
  .cab-marca {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #000;
  }
  .cab-marca span { color: #6d28d9; }
  .cab-titulo {
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6d28d9;
  }
  .cab-sub {
    font-size: 8px;
    color: #555;
    text-align: right;
  }

  /* Grilla — ocupa todo el espacio restante */
  .grid-qr {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 2mm;
    min-height: 0;
  }

  /* Celda QR */
  .qr-item {
    border: 1px solid #e0d4f7;
    border-radius: 1.5mm;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1mm 1mm 0.5mm;
    overflow: hidden;
    min-height: 0;
  }
  .qr-item img {
    display: block;
    width: 100%;
    flex: 1;
    object-fit: contain;
    min-height: 0;
  }
  .qr-lbl {
    font-size: 7px;
    font-weight: 900;
    color: #6d28d9;
    text-align: center;
    margin-top: 0.5mm;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .qr-web {
    font-size: 6px;
    color: #888;
    text-align: center;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Pie compacto */
  .hoja-pie {
    flex-shrink: 0;
    border-top: 1.5px solid #6d28d9;
    margin-top: 2mm;
    padding-top: 1.5mm;
    display: flex;
    justify-content: space-between;
    font-size: 7px;
    color: #555;
  }
  .hoja-pie strong { color: #000; }
</style>
</head>
<body>

<div id="controles">
  <h1>💎 Diamantes Free Fire</h1>
  <p class="sub">30 códigos QR — tamaño carta completo</p>
  <button id="btn-imprimir" onclick="window.print()">🖨️ Imprimir hoja</button>
</div>

<div id="hoja">
  <div class="hoja-cabecera">
    <div class="cab-marca">OFFICE<span>LL</span></div>
    <div style="text-align:center">
      <div class="cab-titulo">💎 Diamantes Free Fire</div>
      <div class="cab-sub">Escanea para comprar tu recarga al instante</div>
    </div>
    <div class="cab-sub">Danlí, Honduras<br>WhatsApp: 9332-3393</div>
  </div>

  <div class="grid-qr" id="gridQR"></div>

  <div class="hoja-pie">
    <span>officell-hn.github.io/tienda.html</span>
    <span>Servicio Técnico &amp; Banca · Recargas de juegos</span>
    <span><strong>OFFICELL</strong> — WhatsApp: 9332-3393</span>
  </div>
</div>

<script>
const URL_DESTINO = 'https://officell-hn.github.io/tienda.html?cat=diamantes-ff';
const TOTAL = 30;
const grid = document.getElementById('gridQR');

async function generarQRs() {
  for (let i = 0; i < TOTAL; i++) {
    const item = document.createElement('div');
    item.className = 'qr-item';

    // Generar QR como data URL de alta resolución
    const dataUrl = await QRCode.toDataURL(URL_DESTINO, {
      width: 500,
      margin: 1,
      errorCorrectionLevel: 'M',
      color: { dark: '#000000', light: '#ffffff' }
    });

    const img = document.createElement('img');
    img.src = dataUrl;
    img.alt = 'QR Diamantes Free Fire';

    const lbl = document.createElement('div');
    lbl.className = 'qr-lbl';
    lbl.textContent = '💎 Diamantes Free Fire';

    const web = document.createElement('div');
    web.className = 'qr-web';
    web.textContent = 'officell-hn.github.io';

    item.appendChild(img);
    item.appendChild(lbl);
    item.appendChild(web);
    grid.appendChild(item);
  }
}

generarQRs();
</script>
</body>
</html>
