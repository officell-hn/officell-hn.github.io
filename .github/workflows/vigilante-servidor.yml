name: Vigilante del servidor

# Vigila el servidor de OFFICELL en Oracle y avisa por Telegram si se cae.
#
# ⛔ POR QUÉ VIVE EN ESTE REPOSITORIO Y NO EN EL DE LA IA:
#    GitHub cobra los minutos de Actions en los repositorios PRIVADOS. Un
#    chequeo cada 15 minutos son ~2,880 minutos al mes contra 2,000 gratis:
#    costaría dinero. En los repositorios PÚBLICOS los minutos son ilimitados
#    y gratis, y este lo es. La meta del proyecto es cero, así que va acá.
#
# ⛔ Y POR QUÉ NO VIVE EN EL PROPIO SERVIDOR:
#    un vigilante que corre adentro de lo que vigila se cae junto con él. Este
#    mira desde afuera, desde las máquinas de GitHub.

on:
  schedule:
    # Cada 15 minutos. GitHub a veces lo atrasa unos minutos; para avisar de
    # una caída es más que suficiente.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: vigilante-servidor
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revisar el servidor y avisar si está caído
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          # Se limpian espacios y saltos: si al guardar el secreto se colo un
          # salto de linea, la llamada a Telegram fallaria justo el dia que
          # hace falta, y sin decir por que.
          TOKEN=$(printf %s "$TOKEN" | tr -d "[:space:]")
          CHAT=$(printf %s "$CHAT" | tr -d "[:space:]")
          URL="https://officell.duckdns.org/salud-servidor"

          revisar() {
            curl -sS --max-time 20 -o /tmp/respuesta -w '%{http_code}' "$URL" 2>/tmp/error || echo "000"
          }

          CODIGO=$(revisar)
          CUERPO=$(cat /tmp/respuesta 2>/dev/null || true)

          # ⛔ Un solo fallo no es una caída: puede ser un hipo de red de
          #    GitHub. Se reintenta antes de despertar a nadie — un vigilante
          #    que grita en falso termina ignorado, y entonces no sirve.
          if [ "$CODIGO" != "200" ] || [ "$CUERPO" != "servidor-ok" ]; then
            echo "primer intento falló (código $CODIGO). Reintentando en 30s..."
            sleep 30
            CODIGO=$(revisar)
            CUERPO=$(cat /tmp/respuesta 2>/dev/null || true)
          fi

          if [ "$CODIGO" = "200" ] && [ "$CUERPO" = "servidor-ok" ]; then
            echo "✅ servidor OK"
          else
            MOTIVO="código HTTP $CODIGO"
            [ "$CODIGO" = "000" ] && MOTIVO="no contestó nada (sin conexión o apagado)"
            echo "⛔ SERVIDOR CAÍDO — $MOTIVO"
            if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
              curl -sS --max-time 20 \
                -d "chat_id=$CHAT" \
                --data-urlencode "text=🔴 EL SERVIDOR DE ORACLE NO RESPONDE
$MOTIVO
Dos intentos con 30 segundos de diferencia.
officell.duckdns.org
— Vigilante" \
                "https://api.telegram.org/bot$TOKEN/sendMessage" >/dev/null && echo "aviso enviado por Telegram"
            else
              echo "⚠️ sin TELEGRAM_BOT_TOKEN o TELEGRAM_OWNER_CHAT_ID: no se pudo avisar"
            fi
            exit 1
          fi

      - name: Avisar si el certificado está por vencer
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          # Caddy renueva solo, pero si alguna vez falla conviene enterarse
          # ANTES de que Meta deje de entregar los mensajes por certificado
          # vencido, no después.
          TOKEN=$(printf %s "$TOKEN" | tr -d "[:space:]")
          CHAT=$(printf %s "$CHAT" | tr -d "[:space:]")
          FIN=$(echo | openssl s_client -servername officell.duckdns.org \
                  -connect officell.duckdns.org:443 2>/dev/null \
                | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          [ -z "$FIN" ] && { echo "no pude leer el certificado"; exit 0; }
          DIAS=$(( ( $(date -d "$FIN" +%s) - $(date +%s) ) / 86400 ))
          echo "el certificado vence en $DIAS días ($FIN)"
          if [ "$DIAS" -lt 10 ] && [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            curl -sS --max-time 20 -d "chat_id=$CHAT" \
              --data-urlencode "text=🟠 El certificado de officell.duckdns.org vence en $DIAS días y no se ha renovado solo. Revisar Caddy.
— Vigilante" \
              "https://api.telegram.org/bot$TOKEN/sendMessage" >/dev/null
          fi
